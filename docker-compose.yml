services:
  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.6.1
    ports:
      - "3000:3000"
    environment:
      GF_INSTALL_PLUGINS: "https://github.com/grafana/grafana-infinity-datasource/releases/download/v2.4.0/yesoreyeram-infinity-datasource-2.4.0.zip;yesoreyeram-infinity-datasource"
      GF_LOG_LEVEL: debug
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OAUTH_CLIENT_ID}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET}
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid email profile roles"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${KEYCLOAK_ISSUER_URL}/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${KEYCLOAK_INTERNAL_URL}/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: ${KEYCLOAK_INTERNAL_URL}/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: dashboard_roles
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(roles[*], 'Admin') && 'Admin' || contains(roles[*], 'Editor') && 'Editor' || 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_SYNC: "false"

    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - influxdb
      - keycloak
    networks:
      - monitoring

  telegraf:
    image: telegraf:1.30
    restart: always
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      - influxdb
    networks:
      - monitoring

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - monitoring

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - monitoring

  eth_collector:
    build: ./eth_collector
    environment:
      MONGO_URL: ${MONGO_URL}
      POLL_INTERVAL: ${ETH_COLLECTOR_POLL_INTERVAL}
    depends_on:
      - mongo
    networks:
      - monitoring

  eth_api:
    build: ./eth_api
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: ${MONGO_URL}
    depends_on:
      - mongo
    networks:
      - monitoring

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    volumes:
      - rustfs_data:/data
    networks:
      - monitoring

  polaris:
    image: apache/polaris:latest
    ports:
      - "8181:8181"
      - "8182:8182"
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_ENDPOINT_URL_S3: http://rustfs:9000
      AWS_REGION: us-east-1
      QUARKUS_CONFIG_LOCATIONS: /deployments/config/application.properties
    volumes:
      - ./polaris-config/application.properties:/deployments/config/application.properties
    depends_on:
      - rustfs
      - keycloak
      - polaris-db
    networks:
      - monitoring

  polaris-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POLARIS_DB_NAME}
      POSTGRES_USER: ${POLARIS_DB_USER}
      POSTGRES_PASSWORD: ${POLARIS_DB_PASSWORD}
    volumes:
      - polaris_db_data:/var/lib/postgresql/data
    networks:
      - monitoring

  spark-sync:
    image: apache/spark:3.5.1
    user: root
    volumes:
      - ./spark-job:/opt/spark-job
    environment:
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS}
    entrypoint:
      - bash
      - /opt/spark-job/periodic_sync.sh
    depends_on:
      - mongo
      - polaris
      - rustfs
    restart: always
    networks:
      - monitoring

volumes:
  influxdb_data:
  grafana_data:
  keycloak_data:
  mongo_data:
  rustfs_data:
  polaris_db_data:

networks:
  monitoring:
    driver: bridge